<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" role="img" aria-label="CGI 실행 — 출력을 파이프로 먼저 받아서 응답">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="319" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#0b0b0b">CGI 실행 — 출력을 파이프로 먼저 받아서 응답</text>
<text x="24" y="57" font-size="12.5" fill="#52514e">cgi.c · 자식은 execve 전까지 async-signal-safe 함수만 사용</text>
<g><path d="M214,118 L320,118" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="220.335" y="100" width="93.33" height="17" rx="3" fill="#fcfcfb"/><text x="267" y="112" font-size="11.5" fill="#52514e" text-anchor="middle">fork + execve</text></g><g><path d="M214,142 L320,142" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="210.675" y="154" width="112.64999999999998" height="17" rx="3" fill="#fcfcfb"/><text x="267" y="166" font-size="11.5" fill="#52514e" text-anchor="middle">POST 본문 → stdin</text></g><g><path d="M520,130 L660,130" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="546.095" y="112" width="87.81" height="17" rx="3" fill="#fcfcfb"/><text x="590" y="124" font-size="11.5" fill="#52514e" text-anchor="middle">출력 → stdout</text></g><g><path d="M768,156 L768,240" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="772" y="190" width="31" height="17" rx="3" fill="#fcfcfb"/><text x="776" y="202" font-size="11.5" fill="#52514e" text-anchor="start">정상</text></g><g><path d="M708,156 L708,196 L420,196 L420,240" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="474.78499999999997" y="178" width="178.43" height="17" rx="3" fill="#fcfcfb"/><text x="564" y="190" font-size="11.5" fill="#52514e" text-anchor="middle">5초 초과 · 1MB 초과 · 형식 오류</text></g><g><rect x="24" y="104" width="190" height="52" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.14)"/><rect x="24" y="104" width="4" height="52" rx="2" fill="#898781"/><text x="38" y="124" font-size="13" font-weight="600" fill="#0b0b0b">워커</text><text x="38" y="141" font-size="11.5" fill="#52514e">fork 전에 환경변수 준비</text></g><g><rect x="320" y="104" width="200" height="52" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.14)"/><rect x="320" y="104" width="4" height="52" rx="2" fill="#1baf7a"/><text x="334" y="124" font-size="13" font-weight="600" fill="#0b0b0b">CGI 프로세스 (adder 등)</text><text x="334" y="141" font-size="11.5" fill="#52514e">자기 프로세스 그룹</text></g><g><rect x="660" y="104" width="216" height="52" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.14)"/><rect x="660" y="104" width="4" height="52" rx="2" fill="#898781"/><text x="674" y="124" font-size="13" font-weight="600" fill="#0b0b0b">워커가 출력 수집</text><text x="674" y="141" font-size="11.5" fill="#52514e">poll로 입출력 동시 · 5초 · 1MB</text></g><g><rect x="660" y="240" width="216" height="52" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.14)"/><rect x="660" y="240" width="4" height="52" rx="2" fill="#1baf7a"/><text x="674" y="260" font-size="13" font-weight="600" fill="#0b0b0b">헤더 검사 + Content-Length</text><text x="674" y="277" font-size="11.5" fill="#52514e">→ HTTP 응답 · 연결 유지 가능</text></g><g><rect x="320" y="240" width="200" height="52" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.14)"/><rect x="320" y="240" width="4" height="52" rx="2" fill="#d03b3b"/><text x="334" y="260" font-size="13" font-weight="600" fill="#0b0b0b">504 / 502</text><text x="334" y="277" font-size="11.5" fill="#52514e">그룹 SIGKILL · waitpid 회수</text></g>
</svg>
