<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" role="img" aria-label="Reverse · Forward Proxy — 같은 proxy_relay로 중계">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="379" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#f0efec">Reverse · Forward Proxy — 같은 proxy_relay로 중계</text>
<text x="24" y="57" font-size="12.5" fill="#c3c2b7">다른 점은 어디로 접속할지를 누가 정하는가 (운영자의 routes.conf / 클라이언트의 URL)</text>
<g><path d="M174,176 L204,176" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/></g><g><path d="M440,166 L458,166 L458,116 L476,116" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/></g><g><path d="M440,186 L458,186 L458,236 L476,236" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/></g><g><path d="M686,116 L716,116" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/></g><g><path d="M686,236 L716,236" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/></g><g><path d="M876,116 L890,116 L890,332 L686,332" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/></g><g><path d="M796,262 L796,332" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/></g><g><path d="M476,332 L440,332" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/></g><g><rect x="24" y="150" width="150" height="52" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="24" y="150" width="4" height="52" rx="2" fill="#898781"/><text x="38" y="170" font-size="13" font-weight="600" fill="#f0efec">클라이언트 요청</text><text x="38" y="187" font-size="11.5" fill="#c3c2b7">dispatch에서 분기</text></g><g><rect x="204" y="150" width="236" height="52" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="204" y="150" width="4" height="52" rx="2" fill="#9085e9"/><text x="218" y="170" font-size="13" font-weight="600" fill="#f0efec">proxy_relay()</text><text x="218" y="187" font-size="11.5" fill="#c3c2b7">hop-by-hop 제거 · Connection: close</text></g><g><rect x="476" y="90" width="210" height="52" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="476" y="90" width="4" height="52" rx="2" fill="#9085e9"/><text x="490" y="110" font-size="13" font-weight="600" fill="#f0efec">Reverse (-c routes.conf)</text><text x="490" y="127" font-size="11.5" fill="#c3c2b7">최장 prefix · Round-Robin</text></g><g><rect x="476" y="210" width="210" height="52" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="476" y="210" width="4" height="52" rx="2" fill="#9085e9"/><text x="490" y="230" font-size="13" font-weight="600" fill="#f0efec">Forward (-f)</text><text x="490" y="247" font-size="11.5" fill="#c3c2b7">URL에서 host · port · Host 재작성</text></g><g><rect x="716" y="90" width="160" height="52" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="716" y="90" width="4" height="52" rx="2" fill="#199e70"/><text x="730" y="110" font-size="13" font-weight="600" fill="#f0efec">백엔드 1 / 2</text><text x="730" y="127" font-size="11.5" fill="#c3c2b7">꺼진 백엔드는 건너뜀</text></g><g><rect x="716" y="210" width="160" height="52" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="716" y="210" width="4" height="52" rx="2" fill="#199e70"/><text x="730" y="230" font-size="13" font-weight="600" fill="#f0efec">원 서버</text><text x="730" y="247" font-size="11.5" fill="#c3c2b7">connect 5초 제한</text></g><g><rect x="476" y="306" width="210" height="52" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="476" y="306" width="4" height="52" rx="2" fill="#9085e9"/><text x="490" y="326" font-size="13" font-weight="600" fill="#f0efec">응답 검사</text><text x="490" y="343" font-size="11.5" fill="#c3c2b7">깨진 응답 502 · 5초 초과 504</text></g><g><rect x="204" y="306" width="236" height="52" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="204" y="306" width="4" height="52" rx="2" fill="#898781"/><text x="218" y="326" font-size="13" font-weight="600" fill="#f0efec">클라이언트로 전달</text><text x="218" y="343" font-size="11.5" fill="#c3c2b7">받는 즉시 스트리밍</text></g>
</svg>
